# Create a new simplified config
cat > scenarios/deathmatch_simple.cfg << 'EOF'
doom_scenario_path = deathmatch.wad
doom_skill = 3

screen_resolution = RES_320X240
render_hud = false

episode_start_time = 1
episode_timeout = 4200

# Simplified action space (7 buttons = 128 actions)
available_buttons = {
    MOVE_FORWARD
    MOVE_BACKWARD
    TURN_LEFT
    TURN_RIGHT
    MOVE_LEFT
    MOVE_RIGHT
    ATTACK
}

available_game_variables = {
    KILLCOUNT
    HEALTH
    ARMOR
    SELECTED_WEAPON
    SELECTED_WEAPON_AMMO
}

mode = PLAYER
EOF